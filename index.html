<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Prevenção - Loja 482</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #E30014; 
            --dark-bg: #121212;
            --light: #FFFFFF;
            --success: #28A745;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            background-color: #F2F2F7;
            color: #1C1C1E;
        }

        /* --- TELA DE LOGIN --- */
        #wrapper-login {
            display: flex; align-items: center; justify-content: center; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1C1C1E 0%, #000000 100%);
            z-index: 10000; padding: 20px;
        }

        #wrapper-login::before {
            content: ""; position: absolute; top: -50px; right: -50px;
            width: 200px; height: 200px; background: var(--primary);
            filter: blur(100px); opacity: 0.3;
        }

        .login-box {
            width: 100%; max-width: 350px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 25px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .login-box h2 { 
            color: #FFFFFF; font-size: 18px; font-weight: 400; 
            text-transform: uppercase; margin-bottom: 30px; 
            letter-spacing: 2px; line-height: 1.4;
        }

        .login-box input {
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.95); 
            font-size: 16px; color: #000; outline: none;
        }

        .btn-entrar {
            width: 100%; padding: 16px; background: var(--primary); color: #FFFFFF;
            border: none; border-radius: 10px; cursor: pointer; font-weight: 700; 
            font-size: 16px; text-transform: uppercase; margin-top: 20px;
            transition: opacity 0.2s;
        }
        .btn-entrar:active { opacity: 0.8; }

        /* --- SISTEMA PRINCIPAL --- */
        .container {
            width: 100%; max-width: 900px; margin: 0 auto; 
            background: white; padding: 15px; display: none;
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px;
        }

        .header-top h1 { margin: 0; font-size: 18px; color: var(--primary); font-weight: 800; }

        .btn-sair { 
            background: #000; color: white; border: none; padding: 8px 12px; 
            border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;
        }

        p.subtitle { text-align: center; color: #8E8E93; font-size: 13px; margin: 5px 0 20px; font-weight: 600; text-transform: uppercase; }

        .dashboard { display: flex; gap: 10px; margin-bottom: 20px; }
        .card {
            flex: 1; background: #F2F2F7; padding: 12px; border-radius: 10px;
            text-align: center; border-bottom: 3px solid var(--primary);
        }
        .card.green { border-bottom-color: var(--success); }
        .card h3 { margin: 0; font-size: 10px; color: #8E8E93; text-transform: uppercase; }
        .card p { margin: 5px 0 0 0; font-size: 18px; font-weight: 800; }

        form {
            display: flex; flex-direction: column; gap: 12px; 
            background: #F2F2F7; padding: 15px; border-radius: 12px; margin-bottom: 25px;
        }

        label { font-size: 11px; font-weight: 700; color: #1C1C1E; text-transform: uppercase; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #D1D1D6; border-radius: 8px; 
            font-size: 16px; background: #FFFFFF;
        }
        input:disabled { background: #E5E5EA; color: #8E8E93; }

        form button[type="submit"] {
            background: var(--primary); color: white; border: none;
            padding: 16px; font-size: 16px; font-weight: 700; border-radius: 10px;
            margin-top: 5px; cursor: pointer; text-transform: uppercase;
            width: 100%;
        }

        /* --- FILTRO POR PERÍODO --- */
        .filter-box {
            background: #F2F2F7; padding: 15px; border-radius: 12px;
            margin-bottom: 20px;
        }
        .filter-box h3 { margin-top: 0; margin-bottom: 12px; font-size: 12px; color: #1C1C1E; text-transform: uppercase; }
        .filter-grid {
            display: flex; flex-direction: column; gap: 10px;
        }
        .filter-grid > div { display: flex; flex-direction: column; }
        .btn-filter { background: var(--dark-bg); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-clear { background: #8E8E93; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .table-container { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E5E5EA; font-size: 13px; }
        th { background: #1C1C1E; color: white; text-transform: uppercase; font-size: 10px; }

        .delete-btn { color: var(--primary); border: 1px solid var(--primary); background: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; }

        .pdf-btn { 
            background: var(--success); width: 100%; padding: 18px; 
            color: white; border: none; border-radius: 12px; font-weight: 800; 
            font-size: 15px; text-transform: uppercase; margin-top: 25px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); cursor: pointer;
        }

        #container-grafico-oculto { position: absolute; left: -9999px; top: 0; width: 600px; height: 300px; }

        @media (min-width: 600px) {
            form { display: grid; grid-template-columns: 1fr 1fr; }
            .full-width, form button[type="submit"] { grid-column: span 2; }
            .container { margin: 20px auto; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
            .filter-grid { flex-direction: row; align-items: flex-end; }
            .filter-grid > div { flex: 1; }
            .btn-filter, .btn-clear { width: auto; padding: 12px 20px; }
        }
    </style>
</head>
<body>

<div id="wrapper-login">
    <div class="login-box">
        <h2>Acesso de Fiscal autorizado</h2>
        <input type="email" id="email-login" placeholder="E-mail">
        <input type="password" id="senha-login" placeholder="Senha">
        <button type="button" id="btn-entrar" class="btn-entrar">ENTRAR</button>
        <p id="erro-login" style="color: #FF453A; font-weight: bold; margin-top: 15px; font-size: 13px; display: none;"></p>
    </div>
</div>

<div id="sistema-principal" class="container">
    <div class="header-top">
        <h1>RADAR LOJA 482</h1>
        <button type="button" id="btn-sair" class="btn-sair">SAIR</button>
    </div>
    
    <p class="subtitle">Controle de RFID Violado - Operação</p>

    <form id="rfidForm">
        <div class="full-width">
            <label>Fiscal Logado</label>
            <input type="text" id="fiscalLogado" disabled>
        </div>
        <div>
            <label>Data</label>
            <input type="date" id="data" required>
        </div>
        <div>
            <label>Setor/Localização</label>
            <select id="setor" required>
                <option value="">Selecione...</option>
                <option value="Provador Feminino">Provador Feminino</option>
                <option value="Provador Masculino">Provador Masculino</option>
                <option value="Salão de Vendas">Salão de Vendas</option>
                <option value="Retaguarda">Retaguarda</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <div>
            <label>Código SKU</label>
            <input type="number" id="sku" placeholder="000000000" required>
        </div>
        <div>
            <label>Valor (R$)</label>
            <input type="text" id="valor" placeholder="0,00" oninput="formatarMoeda(this)" required>
        </div>
        <div class="full-width">
            <label>Descrição da Peça</label>
            <input type="text" id="descricao" placeholder="Ex: Calça Denim" required>
        </div>
        <button type="submit" id="btn-registrar">REGISTRAR OCORRÊNCIA</button>
    </form>

    <div class="filter-box">
        <h3>Filtro por Período</h3>
        <div class="filter-grid">
            <div>
                <label>Data Inicial</label>
                <input type="date" id="filtroDataInicio">
            </div>
            <div>
                <label>Data Final</label>
                <input type="date" id="filtroDataFim">
            </div>
            <button type="button" class="btn-filter" onclick="window.aplicarFiltro()">Filtrar</button>
            <button type="button" class="btn-clear" onclick="window.limparFiltro()">Limpar</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Peças</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="card green">
            <h3>Prejuízo</h3>
            <p id="totalValue">R$ 0,00</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Fiscal</th>
                    <th>Setor</th>
                    <th>SKU / Descrição</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>

    <button type="button" id="btn-pdf" class="pdf-btn">EXPORTAR EM PDF</button>

    <div id="container-grafico-oculto">
        <canvas id="graficoSetor"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJrbK-tCGHdrX71zD_xUxmISCZbsESW5I",
      authDomain: "radarloja482.firebaseapp.com",
      projectId: "radarloja482",
      storageBucket: "radarloja482.firebasestorage.app",
      messagingSenderId: "342229469819",
      appId: "1:342229469819:web:491c83eb4a4d61fe0270de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let ocorrenciasGlobais = [];
    let ocorrenciasExibidas = [];

    onAuthStateChanged(auth, (user) => {
        const login = document.getElementById('wrapper-login');
        const sistema = document.getElementById('sistema-principal');
        if (user) {
            login.style.display = 'none';
            sistema.style.display = 'block';
            let nome = user.email.split('@')[0];
            document.getElementById('fiscalLogado').value = nome.charAt(0).toUpperCase() + nome.slice(1);
            carregarDados();
        } else {
            login.style.display = 'flex';
            sistema.style.display = 'none';
        }
    });

    document.getElementById('btn-entrar').addEventListener('click', () => {
        const email = document.getElementById('email-login').value;
        const senha = document.getElementById('senha-login').value;
        if(!email || !senha) return;
        
        signInWithEmailAndPassword(auth, email, senha).catch(() => {
            const erro = document.getElementById('erro-login');
            erro.style.display = 'block';
            erro.innerText = "DADOS INCORRETOS";
        });
    });

    document.getElementById('btn-sair').addEventListener('click', () => { signOut(auth); });

    window.formatarMoeda = (el) => {
        let v = el.value.replace(/\D/g, "");
        if (v === "") return;
        v = (parseInt(v, 10) / 100).toFixed(2);
        el.value = v.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    };

    document.getElementById('data').valueAsDate = new Date();

    document.getElementById('rfidForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-registrar');
        btn.disabled = true; btn.innerText = "SALVANDO...";
        const valorLimpo = document.getElementById('valor').value.replace(/\./g, "").replace(",", ".");
        try {
            await addDoc(collection(db, "ocorrencias"), {
                fiscal: document.getElementById('fiscalLogado').value,
                setor: document.getElementById('setor').value,
                sku: document.getElementById('sku').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(valorLimpo),
                data: document.getElementById('data').value,
                timestamp: Date.now()
            });
            document.getElementById('rfidForm').reset();
            document.getElementById('data').valueAsDate = new Date();
            let nome = auth.currentUser.email.split('@')[0];
            document.getElementById('fiscalLogado').value = nome.charAt(0).toUpperCase() + nome.slice(1);
        } catch (err) { alert("ERRO AO SALVAR"); } 
        finally { btn.disabled = false; btn.innerText = "REGISTRAR OCORRÊNCIA"; }
    });

    function carregarDados() {
        const q = query(collection(db, "ocorrencias"), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            ocorrenciasGlobais = [];
            snapshot.forEach((docSnap) => {
                ocorrenciasGlobais.push({ id: docSnap.id, ...docSnap.data() });
            });
            window.aplicarFiltro(); // Aplica o filtro atual sempre que chegam novos dados
        });
    }

    // --- FUNÇÕES DE FILTRO RESTAURADAS ---
    window.aplicarFiltro = () => {
        const dInicio = document.getElementById('filtroDataInicio').value;
        const dFim = document.getElementById('filtroDataFim').value;
        
        ocorrenciasExibidas = ocorrenciasGlobais;
        
        if (dInicio) {
            ocorrenciasExibidas = ocorrenciasExibidas.filter(item => item.data >= dInicio);
        }
        if (dFim) {
            ocorrenciasExibidas = ocorrenciasExibidas.filter(item => item.data <= dFim);
        }
        
        atualizarTela(ocorrenciasExibidas);
    };

    window.limparFiltro = () => {
        document.getElementById('filtroDataInicio').value = '';
        document.getElementById('filtroDataFim').value = '';
        window.aplicarFiltro();
    };

    function atualizarTela(dados) {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';
        let total = 0;
        
        dados.forEach((item) => {
            total += item.valor;
            tbody.innerHTML += `<tr>
                <td>${item.data.split('-').reverse().join('/')}</td>
                <td><strong>${item.fiscal}</strong></td>
                <td>${item.setor}</td>
                <td>${item.sku} - ${item.descricao}</td>
                <td>R$ ${item.valor.toFixed(2).replace('.', ',')}</td>
                <td><button class="delete-btn" onclick="window.deletarRegistro('${item.id}')">Excluir</button></td>
            </tr>`;
        });
        
        document.getElementById('totalItems').innerText = dados.length;
        document.getElementById('totalValue').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    window.deletarRegistro = async (id) => {
        if(confirm("Excluir registro?")) { await deleteDoc(doc(db, "ocorrencias", id)); }
    };

    // --- PDF AGORA PUXA OS DADOS FILTRADOS ---
    document.getElementById('btn-pdf').addEventListener('click', () => {
        if(ocorrenciasExibidas.length === 0) return alert("Sem dados para exportar no período selecionado.");
        
        const dadosSetor = {};
        ocorrenciasExibidas.forEach(item => { dadosSetor[item.setor] = (dadosSetor[item.setor] || 0) + item.valor; });
        
        const canvas = document.getElementById('graficoSetor');
        const ctx = canvas.getContext('2d');
        if (window.meuGrafico) window.meuGrafico.destroy();
        
        window.meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(dadosSetor),
                datasets: [{ label: 'Prejuízo (R$)', data: Object.values(dadosSetor), backgroundColor: '#E30014' }]
            },
            options: { responsive: false, animation: false, plugins: { legend: { display: false } } }
        });
        
        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            pdf.setFontSize(18); pdf.setTextColor(227, 0, 20); pdf.text("RELATÓRIO DE PERDAS - LOJA 482", 14, 20);
            
            const colunas = ["Data", "Fiscal", "Setor", "SKU / Descrição", "Valor"];
            const linhas = ocorrenciasExibidas.map(item => [
                item.data.split('-').reverse().join('/'),
                item.fiscal, item.setor, `${item.sku} - ${item.descricao}`,
                `R$ ${item.valor.toFixed(2).replace('.', ',')}`
            ]);
            
            pdf.autoTable({ startY: 30, head: [colunas], body: linhas, theme: 'striped', headStyles: { fillColor: [51, 51, 51] } });
            pdf.addPage(); pdf.text("ANÁLISE POR SETOR", 14, 20);
            pdf.addImage(canvas.toDataURL("image/png"), 'PNG', 15, 30, 180, 90);
            
            pdf.save(`Relatorio_Radar_482.pdf`);
        }, 500);
    });
</script>
</body>
</html>
