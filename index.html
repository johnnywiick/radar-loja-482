    <style>
        :root {
            --primary: #E30014; 
            --dark: #1a1a1a;
            --light: #F8F9FA;
            --success: #28A745; /* Verde para o botão de PDF */
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ECECEC;
        }

        /* --- TELA DE LOGIN REFINADA COM FUNDO DE SEGURANÇA --- */
        #wrapper-login {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Imagem de fundo focada em segurança/tecnologia */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1557597774-9d2739f85a76?auto=format&fit=crop&q=80&w=1600');
            background-size: cover;
            background-position: center;
        }

        .login-box {
            width: 100%;
            max-width: 380px; 
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .login-box h2 { 
            color: #fff; 
            margin-top: 0; 
            font-size: 24px; 
            font-weight: 300; 
            text-transform: uppercase; 
            letter-spacing: 6px; 
            margin-bottom: 35px; 
        }

        .login-box input {
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3); 
            background: rgba(0, 0, 0, 0.2);
            box-sizing: border-box; 
            font-size: 15px;
            color: #fff;
            outline: none;
        }

        .login-box input::placeholder { color: rgba(255, 255, 255, 0.5); }

        .btn-entrar {
            width: 100%; 
            padding: 15px; 
            background: #fff; 
            color: #1a1a1a;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-entrar:hover { background: var(--light); transform: translateY(-2px); }

        /* --- SISTEMA PRINCIPAL --- */
        .container {
            max-width: 900px; 
            margin: 20px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-top {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 15px; 
            margin-bottom: 20px;
        }

        .header-top h1 { margin: 0; font-size: 22px; color: var(--primary); }
