<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Radar de Prevenção - Loja 482</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #E30014; 
            --dark: #333333;
            --light: #F8F9FA;
            --success: #28A745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ECECEC;
            margin: 0;
            padding: 10px; 
            color: var(--dark);
        }
        
        /* --- ESTILOS DA TELA DE LOGIN --- */
        .login-box {
            max-width: 400px; 
            margin: 80px auto; 
            padding: 30px;
            background: white; 
            border-radius: 10px;
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .login-box h2 { color: var(--primary); margin-top: 0; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #ccc; box-sizing: border-box; font-size: 15px;
        }
        .btn-entrar {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;
        }
        .btn-entrar:hover { background: #cc000d; }

        /* --- ESTILOS DO SISTEMA PRINCIPAL --- */
        .container {
            max-width: 900px; margin: 0 auto; background: white; padding: 15px; 
            border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .header-top {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px;
        }
        .header-top h1 { margin: 0; font-size: 20px; color: var(--primary); }
        .btn-sair {
            background-color: var(--dark); color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        p.subtitle { text-align: center; color: #777; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
        
        /* Filtro de Relatório */
        .filter-box {
            background: var(--light); padding: 15px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid #ddd;
        }
        .filter-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 14px; color: var(--primary); }
        .filter-grid {
            display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; align-items: end;
        }
        .btn-filter { background-color: var(--dark); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .btn-clear { background-color: #777; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}

        .dashboard { display: flex; gap: 10px; margin-bottom: 20px; }
        .card {
            flex: 1; background: var(--light); padding: 12px; border-radius: 8px;
            text-align: center; border-left: 5px solid var(--primary);
        }
        .card.green { border-left-color: var(--success); }
        .card h3 { margin: 0; font-size: 13px; color: #555; }
        .card p { margin: 8px 0 0 0; font-size: 20px; font-weight: bold; }
        
        .chart-hidden { position: absolute; left: -9999px; top: 0; width: 600px; height: 300px; }

        form {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--light);
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }
        .full-width { grid-column: span 2; }
        label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 3px; }
        input, select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;
            box-sizing: border-box; font-size: 14px;
        }
        input:disabled { background-color: #e9ecef; color: #555; font-weight: bold; }
        
        form button[type="submit"] {
            grid-column: span 2; background-color: var(--primary); color: white; border: none;
            padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer;
        }

        .table-container { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 13px; }
        th { background-color: var(--dark); color: white; }
        td button.delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }

        .pdf-btn { 
            background-color: var(--dark); margin-top: 25px; width: 100%; padding: 15px; font-size: 16px; 
            color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        @media (max-width: 600px) {
            .dashboard { flex-direction: column; gap: 8px; }
            form { grid-template-columns: 1fr; } 
            .full-width, form button[type="submit"] { grid-column: span 1; }
            .filter-grid { grid-template-columns: 1fr 1fr; }
            .btn-filter, .btn-clear { grid-column: span 1; width: 100%; padding: 12px;}
        }
    </style>
</head>
<body>

<div id="tela-login" class="login-box" style="display: block;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Lojas_Renner_logo.svg/1024px-Lojas_Renner_logo.svg.png" width="120" style="margin-bottom: 15px;" alt="Renner">
    <h2>Acesso Restrito</h2>
    <p style="color: #666; font-size: 14px;">Radar de Prevenção - Loja 482</p>
    
    <input type="email" id="email-login" placeholder="E-mail de acesso" required>
    <input type="password" id="senha-login" placeholder="Senha" required>
    <button id="btn-entrar" class="btn-entrar">Entrar no Sistema</button>
    <p id="erro-login" style="color: red; display: none; font-weight: bold; margin-top: 15px;">Acesso Negado. Tente novamente.</p>
</div>


<div id="sistema-principal" class="container" style="display: none;">
    
    <div class="header-top">
        <h1>Radar de Prevenção 482</h1>
        <button id="btn-sair" class="btn-sair">Sair da Conta</button>
    </div>
    
    <p class="subtitle">Controle de RFID Violado - Operação</p>

    <form id="rfidForm">
        <div>
            <label>Fiscal Logado</label>
            <input type="text" id="fiscalLogado" disabled>
        </div>
        <div>
            <label>Data</label>
            <input type="date" id="data" required>
        </div>
        <div class="full-width">
            <label>Setor/Localização</label>
            <select id="setor" required>
                <option value="">Selecione...</option>
                <option value="Provador Feminino">Provador Feminino</option>
                <option value="Provador Masculino">Provador Masculino</option>
                <option value="Salão de Vendas">Salão de Vendas</option>
                <option value="Retaguarda">Retaguarda</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <div>
            <label>Código SKU</label>
            <input type="number" id="sku" placeholder="Ex: 552664497" required>
        </div>
        <div>
            <label>Valor (R$)</label>
            <input type="text" id="valor" placeholder="0,00" oninput="formatarMoeda(this)" required>
        </div>
        <div class="full-width">
            <label>Descrição da Peça</label>
            <input type="text" id="descricao" placeholder="Ex: Calça Denim J" required>
        </div>
        
        <button type="submit">Registrar Ocorrência</button>
    </form>

    <div class="filter-box">
        <h3>📅 Extrair Relatório por Período</h3>
        <div class="filter-grid">
            <div>
                <label>Data Inicial</label>
                <input type="date" id="filtroDataInicio">
            </div>
            <div>
                <label>Data Final</label>
                <input type="date" id="filtroDataFim">
            </div>
            <button type="button" class="btn-filter" onclick="aplicarFiltro()">Filtrar Dados</button>
            <button type="button" class="btn-clear" onclick="limparFiltro()">Limpar</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Total no Período</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="card green">
            <h3>Prejuízo Mapeado (R$)</h3>
            <p id="totalValue">R$ 0,00</p>
        </div>
    </div>

    <div class="chart-hidden" id="chartBox">
        <canvas id="graficoSetor"></canvas>
    </div>

    <h3>Ocorrências do Período</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Fiscal</th>
                    <th>Setor</th>
                    <th>SKU / Descrição</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
            </tbody>
        </table>
    </div>

    <button type="button" onclick="exportarPDF()" class="pdf-btn">📄 Exportar PDF do Período</button>
</div>

<script type="module">
    // Importações atualizadas com o pacote de Autenticação
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // Suas chaves originais mantidas
    const firebaseConfig = {
      apiKey: "AIzaSyAJrbK-tCGHdrX71zD_xUxmISCZbsESW5I",
      authDomain: "radarloja482.firebaseapp.com",
      projectId: "radarloja482",
      storageBucket: "radarloja482.firebasestorage.app",
      messagingSenderId: "342229469819",
      appId: "1:342229469819:web:491c83eb4a4d61fe0270de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); // Ligando o motor de senhas

    let ocorrenciasGlobais = []; 
    let ocorrenciasExibidas = []; 
    let meuGrafico = null; 

    // --- CONTROLE DE LOGIN ---
    const telaLogin = document.getElementById('tela-login');
    const sistemaPrincipal = document.getElementById('sistema-principal');
    const btnEntrar = document.getElementById('btn-entrar');
    const btnSair = document.getElementById('btn-sair');
    const erroLogin = document.getElementById('erro-login');
    const inputFiscalLogado = document.getElementById('fiscalLogado');

    // Verifica se o usuário está logado
    onAuthStateChanged(auth, (user) => {
        if (user) {
            telaLogin.style.display = 'none';
            sistemaPrincipal.style.display = 'block';
            
            // Pega o nome do e-mail (Ex: johnny@loja.com vira "Johnny")
            let nomeExtraido = user.email.split('@')[0];
            nomeExtraido = nomeExtraido.charAt(0).toUpperCase() + nomeExtraido.slice(1);
            inputFiscalLogado.value = nomeExtraido; // Preenche o campo travado
            
        } else {
            telaLogin.style.display = 'block';
            sistemaPrincipal.style.display = 'none';
        }
    });

    // Ação do Botão Entrar
    btnEntrar.addEventListener('click', () => {
        const email = document.getElementById('email-login').value;
        const senha = document.getElementById('senha-login').value;

        signInWithEmailAndPassword(auth, email, senha)
            .then(() => {
                erroLogin.style.display = 'none';
                document.getElementById('senha-login').value = ''; 
            })
            .catch((error) => {
                erroLogin.style.display = 'block';
            });
    });

    // Ação do Botão Sair
    btnSair.addEventListener('click', () => {
        signOut(auth);
    });

    // --- CÓDIGO ORIGINAL DA APLICAÇÃO ---
    document.getElementById('data').valueAsDate = new Date();

    window.formatarMoeda = function(elemento) {
        let valor = elemento.value.replace(/\D/g, ""); 
        if (valor === "") { elemento.value = ""; return; }
        valor = (parseInt(valor, 10) / 100).toFixed(2);
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        elemento.value = valor;
    }

    const formRfid = document.getElementById('rfidForm');
    formRfid.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        let valorTexto = document.getElementById('valor').value;
        let valorLimpo = valorTexto.replace(/\./g, "").replace(",", ".");
        let valorFloat = parseFloat(valorLimpo);

        try {
            await addDoc(collection(db, "ocorrencias"), {
                fiscal: inputFiscalLogado.value, // Puxa o nome automático
                setor: document.getElementById('setor').value,
                sku: document.getElementById('sku').value,
                descricao: document.getElementById('descricao').value,
                valor: valorFloat,
                data: document.getElementById('data').value,
                timestamp: Date.now() 
            });
            formRfid.reset();
            document.getElementById('data').valueAsDate = new Date();
            // Mantém o nome preenchido após resetar
            inputFiscalLogado.value = auth.currentUser.email.split('@')[0].charAt(0).toUpperCase() + auth.currentUser.email.split('@')[0].slice(1);
        } catch (erro) {
            console.error("Erro ao adicionar: ", erro);
            alert("Erro ao salvar! Verifique sua internet.");
        }
    });

    const q = query(collection(db, "ocorrencias"), orderBy("data", "desc"));
    onSnapshot(q, (querySnapshot) => {
        ocorrenciasGlobais = []; 
        querySnapshot.forEach((doc) => {
            ocorrenciasGlobais.push({ id: doc.id, ...doc.data() });
        });
        window.aplicarFiltro(); 
    });

    window.deletar = async function(id) {
        if(confirm("Tem certeza que deseja apagar este registro?")) {
            try { await deleteDoc(doc(db, "ocorrencias", id)); } 
            catch(erro) { console.error("Erro ao deletar: ", erro); }
        }
    }

    window.aplicarFiltro = function() {
        const dInicio = document.getElementById('filtroDataInicio').value;
        const dFim = document.getElementById('filtroDataFim').value;

        if (dInicio && dFim) {
            ocorrenciasExibidas = ocorrenciasGlobais.filter(item => item.data >= dInicio && item.data <= dFim);
        } else if (dInicio) {
            ocorrenciasExibidas = ocorrenciasGlobais.filter(item => item.data >= dInicio);
        } else if (dFim) {
            ocorrenciasExibidas = ocorrenciasGlobais.filter(item => item.data <= dFim);
        } else {
            ocorrenciasExibidas = [...ocorrenciasGlobais]; 
        }
        atualizarTela();
    }

    window.limparFiltro = function() {
        document.getElementById('filtroDataInicio').value = '';
        document.getElementById('filtroDataFim').value = '';
        window.aplicarFiltro();
    }

    function atualizarTela() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';
        let totalValor = 0;

        ocorrenciasExibidas.forEach(item => {
            totalValor += item.valor;
            const dataParts = item.data.split('-');
            const dataBR = `${dataParts[2]}/${dataParts[1]}/${dataParts[0]}`;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dataBR}</td>
                <td><strong>${item.fiscal}</strong></td>
                <td>${item.setor}</td>
                <td>${item.sku} - ${item.descricao}</td>
                <td>R$ ${item.valor.toFixed(2).replace('.', ',')}</td>
                <td><button class="delete-btn" onclick="deletar('${item.id}')">X</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('
