<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Radar de Prevenção - Loja 482</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #E30014; 
            --dark: #333333;
            --light: #F8F9FA;
            --success: #28A745;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 10px; 
            color: var(--dark);
            min-height: 100vh;
        }
        
        /* --- TELA DE LOGIN CENTRALIZADA --- */
        #tela-login {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px; 
            padding: 40px 30px;
            background: white; 
            border-radius: 15px;
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .logo-renner {
            color: var(--primary);
            font-weight: 900;
            font-size: 48px;
            letter-spacing: -2px;
            margin-bottom: 5px;
            display: block;
            font-family: 'Arial Black', sans-serif;
        }
        .login-box h2 { color: #555; margin-top: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #ddd; box-sizing: border-box; font-size: 15px;
        }
        .btn-entrar {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px;
        }

        /* --- SISTEMA PRINCIPAL --- */
        .container {
            max-width: 900px; margin: 20px auto; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .header-top {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px;
        }
        .header-info h1 { margin: 0; font-size: 22px; color: var(--primary); }
        .btn-sair {
            background-color: var(--dark); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        p.subtitle { text-align: center; color: #888; margin-top: 0; margin-bottom: 25px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .dashboard { display: flex; gap: 15px; margin-bottom: 25px; }
        .card {
            flex: 1; background: #fff; padding: 15px; border-radius: 10px;
            text-align: center; border: 1px solid #eee; border-top: 4px solid var(--primary);
        }
        .card.green { border-top-color: var(--success); }
        .card h3 { margin: 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .card p { margin: 10px 0 0 0; font-size: 24px; font-weight: bold; }
        
        form {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--light);
            padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee;
        }
        .full-width { grid-column: span 2; }
        label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; color: #555; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;
            box-sizing: border-box; font-size: 14px; background: #fff;
        }
        input:disabled { background-color: #f0f0f0; }
        
        form button[type="submit"] {
            grid-column: span 2; background-color: var(--primary); color: white; border: none;
            padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }

        /* --- GRÁFICO VISÍVEL NO SISTEMA --- */
        .chart-container {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fff;
        }

        .table-container { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #666; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .delete-btn { color: #ff4d4d; border: 1px solid #ff4d4d; background: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .pdf-btn { 
            background-color: var(--dark); margin-top: 30px; width: 100%; padding: 16px; font-size: 15px; 
            color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        @media (max-width: 600px) {
            .dashboard { flex-direction: column; }
            form { grid-template-columns: 1fr; } 
            .full-width, form button[type="submit"] { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div id="tela-login">
    <div class="login-box">
        <span class="logo-renner">RENNER</span>
        <h2>Radar de Prevenção</h2>
        <p style="color: #888; font-size: 13px; margin-bottom: 25px;">Acesso Restrito - Loja 482</p>
        
        <input type="email" id="email-login" placeholder="E-mail" required>
        <input type="password" id="senha-login" placeholder="Senha" required>
        <button id="btn-entrar" class="btn-entrar">Entrar no Sistema</button>
        <p id="erro-login" style="color: var(--primary); display: none; font-weight: bold; margin-top: 15px; font-size: 13px;"></p>
    </div>
</div>

<div id="sistema-principal" class="container" style="display: none;">
    <div class="header-top">
        <div class="header-info">
            <h1>Radar de Prevenção 482</h1>
            <p id="txt-boas-vindas" style="margin:0; font-size: 14px; color: #666;"></p>
        </div>
        <button id="btn-sair" class="btn-sair">Sair do Radar</button>
    </div>
    
    <p class="subtitle">Controle de RFID Violado - Operação</p>

    <form id="rfidForm">
        <div>
            <label>Fiscal Responsável</label>
            <input type="text" id="fiscalLogado" disabled>
        </div>
        <div>
            <label>Data</label>
            <input type="date" id="data" required>
        </div>
        <div class="full-width">
            <label>Setor/Localização</label>
            <select id="setor" required>
                <option value="">Selecione...</option>
                <option value="Provador Feminino">Provador Feminino</option>
                <option value="Provador Masculino">Provador Masculino</option>
                <option value="Salão de Vendas">Salão de Vendas</option>
                <option value="Retaguarda">Retaguarda</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <div>
            <label>Código SKU</label>
            <input type="number" id="sku" placeholder="Ex: 552664497" required>
        </div>
        <div>
            <label>Valor da Peça (R$)</label>
            <input type="text" id="valor" placeholder="0,00" oninput="formatarMoeda(this)" required>
        </div>
        <div class="full-width">
            <label>Descrição da Peça</label>
            <input type="text" id="descricao" placeholder="Ex: Calça Denim J" required>
        </div>
        <button type="submit" id="btn-registrar">Registrar Ocorrência</button>
    </form>

    <div class="dashboard">
        <div class="card">
            <h3>Peças Mapeadas</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="card green">
            <h3>Prejuízo Total</h3>
            <p id="totalValue">R$ 0,00</p>
        </div>
    </div>

    <div class="chart-container">
        <h3 style="font-size: 14px; text-transform: uppercase; color: #666; margin-bottom: 15px;">Valores por Setor</h3>
        <canvas id="graficoSetor" style="max-height: 300px; width: 100%;"></canvas>
    </div>

    <h3 style="font-size: 14px; text-transform: uppercase; color: #666;">Histórico de Ocorrências</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Fiscal</th>
                    <th>Setor</th>
                    <th>SKU / Descrição</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>

    <button type="button" id="btn-pdf" class="pdf-btn">📄 Exportar Relatório Analítico (PDF)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJrbK-tCGHdrX71zD_xUxmISCZbsESW5I",
      authDomain: "radarloja482.firebaseapp.com",
      projectId: "radarloja482",
      storageBucket: "radarloja482.firebasestorage.app",
      messagingSenderId: "342229469819",
      appId: "1:342229469819:web:491c83eb4a4d61fe0270de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let ocorrenciasGlobais = [];
    let meuGrafico = null;

    // --- AUTENTICAÇÃO ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('sistema-principal').style.display = 'block';
            let nome = user.email.split('@')[0];
            nome = nome.charAt(0).toUpperCase() + nome.slice(1);
            document.getElementById('fiscalLogado').value = nome;
            document.getElementById('txt-boas-vindas').innerText = "Olá, " + nome + "!";
            ouvirBanco();
        } else {
            document.getElementById('tela-login').style.display = 'flex';
            document.getElementById('sistema-principal').style.display = 'none';
        }
    });

    document.getElementById('btn-entrar').addEventListener('click', () => {
        const email = document.getElementById('email-login').value;
        const senha = document.getElementById('senha-login').value;
        signInWithEmailAndPassword(auth, email, senha).catch(() => {
            const erro = document.getElementById('erro-login');
            erro.style.display = 'block';
            erro.innerText = "E-mail ou senha incorretos!";
        });
    });

    document.getElementById('btn-sair').addEventListener('click', () => { signOut(auth); });

    // --- FORMULÁRIO ---
    window.formatarMoeda = (el) => {
        let v = el.value.replace(/\D/g, "");
        if (v === "") return;
        v = (parseInt(v, 10) / 100).toFixed(2);
        el.value = v.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    };

    document.getElementById('data').valueAsDate = new Date();

    document.getElementById('rfidForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-registrar');
        btn.disabled = true;
        btn.innerText = "Salvando...";

        const valorLimpo = document.getElementById('valor').value.replace(/\./g, "").replace(",", ".");
        
        try {
            await addDoc(collection(db, "ocorrencias"), {
                fiscal: document.getElementById('fiscalLogado').value,
                setor: document.getElementById('setor').value,
                sku: document.getElementById('sku').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(valorLimpo),
                data: document.getElementById('data').value,
                timestamp: Date.now()
            });
            document.getElementById('rfidForm').reset();
            document.getElementById('data').valueAsDate = new Date();
            // Repreenche o fiscal que o reset limpou
            let nome = auth.currentUser.email.split('@')[0];
            document.getElementById('fiscalLogado').value = nome.charAt(0).toUpperCase() + nome.slice(1);
        } catch (err) {
            alert("Erro ao registrar no banco de dados.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Registrar Ocorrência";
        }
    });

    // --- ATUALIZAÇÃO EM TEMPO REAL ---
    function ouvirBanco() {
        const q = query(collection(db, "ocorrencias"), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            ocorrenciasGlobais = [];
            const tbody = document.getElementById('tabelaCorpo');
            tbody.innerHTML = '';
            let total = 0;

            snapshot.forEach((docSnap) => {
                const item = { id: docSnap.id, ...docSnap.data() };
                ocorrenciasGlobais.push(item);
                total += item.valor;
                
                tbody.innerHTML += `
                    <tr>
                        <td>${item.data.split('-').reverse().join('/')}</td>
                        <td><strong>${item.fiscal}</strong></td>
                        <td>${item.setor}</td>
                        <td>${item.sku} - ${item.descricao}</td>
                        <td>R$ ${item.valor.toFixed(2).replace('.', ',')}</td>
                        <td><button class="delete-btn" onclick="window.deletar('${item.id}')">Excluir</button></td>
                    </tr>
                `;
            });

            document.getElementById('totalItems').innerText = ocorrenciasGlobais.length;
            document.getElementById('totalValue').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            atualizarGrafico();
        });
    }

    window.deletar = async (id) => {
        if(confirm("Confirmar exclusão desta ocorrência?")) {
            await deleteDoc(doc(db, "ocorrencias", id));
        }
    };

    // --- GRÁFICO ---
    function atualizarGrafico() {
        const dadosSetor = {};
        ocorrenciasGlobais.forEach(item => {
            dadosSetor[item.setor] = (dadosSetor[item.setor] || 0) + item.valor;
        });

        const ctx = document.getElementById('graficoSetor').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();

        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(dadosSetor),
                datasets: [{
                    label: 'Prejuízo (R$)',
                    data: Object.values(dadosSetor),
                    backgroundColor: '#E30014',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    // --- PDF ---
    document.getElementById('btn-pdf').addEventListener('click', () => {
        if(ocorrenciasGlobais.length === 0) return alert("Sem dados para exportar.");

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        pdf.setFontSize(18);
        pdf.setTextColor(227, 0, 20);
        pdf.text("RADAR DE PREVENÇÃO - LOJA 482", 14, 20);
        
        const colunas = ["Data", "Fiscal", "Setor", "SKU / Descrição", "Valor"];
        const linhas = ocorrenciasGlobais.map(item => [
            item.data.split('-').reverse().join('/'),
            item.fiscal,
            item.setor,
            `${item.sku} - ${item.descricao}`,
            `R$ ${item.valor.toFixed(2).replace('.', ',')}`
        ]);

        pdf.autoTable({
            startY: 30,
            head: [colunas],
            body: linhas,
            theme: 'striped',
            headStyles: { fillColor: [51, 51, 51] }
        });

        pdf.save(`Relatorio_Radar_482.pdf`);
    });
</script>
</body>
</html>
