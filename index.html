<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Prevenção - Loja 482</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #E30014; 
            --dark: #1a1a1a;
            --light: #F8F9FA;
            --success: #28A745;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            background-color: #f4f4f4;
        }

        /* --- TELA DE LOGIN SOFISTICADA VERMELHO/BRANCO --- */
        #wrapper-login {
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
            /* Fundo com imagem de segurança e sobreposição vermelha */
            background: linear-gradient(135deg, rgba(142, 0, 0, 0.9) 0%, rgba(227, 0, 20, 0.7) 100%), 
                        url('https://images.unsplash.com/photo-1557597774-9d2739f85a76?auto=format&fit=crop&q=80&w=1600');
            background-size: cover; background-position: center;
            position: fixed; width: 100%; top: 0; left: 0; z-index: 9999;
        }

        .login-box {
            width: 90%; max-width: 380px; padding: 50px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .login-box h2 { 
            color: #fff; margin-top: 0; font-size: 18px; font-weight: 600; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; 
            line-height: 1.4;
        }

        .login-box input {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box; font-size: 15px; color: #333; outline: none;
        }

        .login-box input::placeholder { color: #888; }

        .btn-entrar {
            width: 100%; padding: 16px; background: #fff; color: var(--primary);
            border: none; border-radius: 10px; cursor: pointer; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; 
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-entrar:hover { background: #f0f0f0; transform: translateY(-2px); }

        /* --- SISTEMA PRINCIPAL --- */
        .container {
            max-width: 900px; margin: 20px auto; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px;
        }

        .header-top h1 { margin: 0; font-size: 20px; color: var(--primary); }

        .btn-sair { 
            background: var(--dark); color: white; border: none; padding: 8px 15px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }

        p.subtitle { text-align: center; color: #777; margin-top: 0; margin-bottom: 25px; font-size: 14px; }

        .dashboard { display: flex; gap: 15px; margin-bottom: 25px; }

        .card {
            flex: 1; background: var(--light); padding: 15px; border-radius: 10px;
            text-align: center; border-left: 5px solid var(--primary);
        }

        .card.green { border-left-color: var(--success); }
        .card h3 { margin: 0; font-size: 11px; color: #555; text-transform: uppercase; }
        .card p { margin: 8px 0 0 0; font-size: 24px; font-weight: bold; }

        form {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--light);
            padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee;
        }

        .full-width { grid-column: span 2; }
        label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        input:disabled { background-color: #e9ecef; }

        form button[type="submit"] {
            grid-column: span 2; background-color: var(--primary); color: white; border: none;
            padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }

        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: var(--dark); color: white; font-size: 11px; text-transform: uppercase; }

        .delete-btn { color: #ff4d4d; border: 1px solid #ff4d4d; background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        /* BOTAO EXPORTAR VERDE EM CAIXA ALTA */
        .pdf-btn { 
            background-color: var(--success); margin-top: 30px; width: 100%; padding: 18px; 
            font-size: 16px; color: white; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .pdf-btn:hover { background-color: #218838; }

        /* GRÁFICO SÓ PARA O PDF */
        #container-grafico-oculto { position: absolute; left: -9999px; top: 0; width: 600px; height: 300px; }

        @media (max-width: 600px) {
            .dashboard { flex-direction: column; }
            form { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

<div id="wrapper-login">
    <div class="login-box">
        <h2>Acesso de Fiscal autorizado</h2>
        <input type="email" id="email-login" placeholder="E-mail">
        <input type="password" id="senha-login" placeholder="Senha">
        <button id="btn-entrar" class="btn-entrar">ENTRAR</button>
        <p id="erro-login" style="color: #fff; background: rgba(227,0,20,0.8); padding: 10px; border-radius: 5px; display: none; font-weight: bold; margin-top: 15px; font-size: 12px;"></p>
    </div>
</div>

<div id="sistema-principal" class="container">
    <div class="header-top">
        <h1>Radar Loja 482</h1>
        <button id="btn-sair" class="btn-sair">SAIR</button>
    </div>
    
    <p class="subtitle">Controle de RFID Violado - Operação</p>

    <form id="rfidForm">
        <div>
            <label>Fiscal em Operação</label>
            <input type="text" id="fiscalLogado" disabled>
        </div>
        <div>
            <label>Data</label>
            <input type="date" id="data" required>
        </div>
        <div class="full-width">
            <label>Setor/Localização</label>
            <select id="setor" required>
                <option value="">Selecione...</option>
                <option value="Provador Feminino">Provador Feminino</option>
                <option value="Provador Masculino">Provador Masculino</option>
                <option value="Salão de Vendas">Salão de Vendas</option>
                <option value="Retaguarda">Retaguarda</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <div>
            <label>Código SKU</label>
            <input type="number" id="sku" placeholder="Ex: 552664497" required>
        </div>
        <div>
            <label>Valor da Peça (R$)</label>
            <input type="text" id="valor" placeholder="0,00" oninput="formatarMoeda(this)" required>
        </div>
        <div class="full-width">
            <label>Descrição da Peça</label>
            <input type="text" id="descricao" placeholder="Ex: Calça Denim J" required>
        </div>
        <button type="submit" id="btn-registrar">Registrar Ocorrência</button>
    </form>

    <div class="dashboard">
        <div class="card">
            <h3>Peças Mapeadas</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="card green">
            <h3>Prejuízo Total</h3>
            <p id="totalValue">R$ 0,00</p>
        </div>
    </div>

    <h3>Histórico</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Fiscal</th>
                    <th>Setor</th>
                    <th>SKU / Descrição</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>

    <button type="button" id="btn-pdf" class="pdf-btn">EXPORTAR EM PDF</button>

    <div id="container-grafico-oculto">
        <canvas id="graficoSetor"></canvas>
    </div>
</div>
